{% extends "base.html" %}
{% block title %}{{ code }} {{ title }} · 街坊库{% endblock %}
{% block content %}
<div class="error-page">
  <div class="error-code">{{ code }}</div>
  <h1>{{ title }}</h1>
  <p class="error-msg">{{ message }}</p>
  <div class="error-actions">
    <a class="btn btn-primary" href="{{ url_for('tools') }}">回工具档案</a>
    <a class="btn" href="{{ url_for('neighbors') }}">回邻居列表</a>
  </div>
</div>
{% endblock %}
